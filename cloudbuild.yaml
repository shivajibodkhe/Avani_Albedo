# Google Cloud Build Pipeline for Avani Albedo
steps:
  # 1. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/avani-albedo:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/avani-albedo:latest', '.']

  # 2. Push Image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/avani-albedo:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'avani-albedo'
      - '--image'
      - 'gcr.io/$PROJECT_ID/avani-albedo:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,APP_MODE=live'

images:
  - 'gcr.io/$PROJECT_ID/avani-albedo:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/avani-albedo:latest'
