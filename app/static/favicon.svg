<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="globeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="coolHalo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow & Atmosphere -->
  <circle cx="32" cy="32" r="28" fill="url(#coolHalo)" opacity="0.25" filter="url(#glow)"/>
  <!-- Planet Core -->
  <circle cx="32" cy="32" r="24" fill="url(#globeGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Continent Landmass Silhouette (Emerald) -->
  <path d="M 24 16 Q 28 20 33 19 Q 38 18 42 22 Q 44 26 40 30 Q 36 34 32 38 Q 28 37 25 33 Q 22 29 21 24 Z" fill="#10b981" opacity="0.9"/>
  <path d="M 34 36 Q 40 37 43 43 Q 41 48 35 47 Q 31 46 32 40 Z" fill="#10b981" opacity="0.85"/>
  <!-- High-Albedo Solar Reflectance Radiance Rings -->
  <path d="M 12 22 A 22 22 0 0 1 52 22" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.9"/>
  <!-- Cooling Snowflake / Star Burst Indicator -->
  <circle cx="46" cy="18" r="3" fill="#ffffff" filter="url(#glow)"/>
  <path d="M 46 13 L 46 23 M 41 18 L 51 18" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
</svg>
